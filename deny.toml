#
# Config for `cargo deny` (https://github.com/EmbarkStudios/cargo-deny):
# checks the dependency graph for known vulnerabilities, disallowed
# licenses, banned/duplicated crates, and untrusted sources. Run locally
# with `cargo deny check`; see docs/SUPPLY_CHAIN_SECURITY.md for how this
# fits into our broader supply-chain story (SBOM, provenance, ...) -- this
# is the part of that story that runs at dependency-resolution time, before
# anything gets built.

[graph]
all-features = true

# ── advisories: RUSTSEC/OSV vulnerabilities, unmaintained/yanked crates ─────
[advisories]
yanked = "deny"
ignore = [
  # atomic-polyfill is unmaintained, not vulnerable. It comes in via
  # phonenumber -> postcard -> heapless 0.7, which only uses it on targets
  # without native atomics, so it is never built for the x86_64 and aarch64
  # targets we ship (`cargo tree -i atomic-polyfill` prints nothing there;
  # only `--target all` shows it). Drop this line once postcard moves to
  # heapless 0.8, or phonenumber stops using postcard.
  "RUSTSEC-2023-0089",
]

# ── licenses: only accept licenses we've reviewed as OK to redistribute ─────
[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

# ── bans: banned crates, duplicate-version bloat, wildcard versions ─────────
[bans]
multiple-versions = "warn" # normal in a graph this size; don't fail CI over it
wildcards = "deny"
deny = []

# ── sources: only allow crates.io, not arbitrary git/registries ─────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
